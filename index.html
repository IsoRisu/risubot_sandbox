<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 5px;
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 15px;
        }
        canvas {
            border: 4px solid #333;
            background-color: #111;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #instructions {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Snake Game</h1>
    <div id="score-board">Score: <span id="score">0</span> | High Score: <span id="high-score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="instructions">Use Arrow Keys to Play. Press Space to Restart when game over.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = 0;
        let gameInterval = null;
        let isGameOver = false;
        let changingDirection = false;

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            isGameOver = false;
            spawnFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Ensure food doesn't spawn on snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function gameLoop() {
            changingDirection = false;
            update();
            if (isGameOver) return;
            draw();
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                }
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.fillStyle = "#ff4757";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // Draw snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#2ed573" : "#7bed9f";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

            ctx.font = "16px sans-serif";
            ctx.fillText("Press SPACE to Restart", canvas.width / 2, canvas.height / 2 + 25);
        }

        document.addEventListener("keydown", e => {
            if (changingDirection) return;

            const keyPressed = e.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;
            const SPACE = 32;

            if (e.key === ' ' || keyPressed === SPACE) {
                if (isGameOver) {
                    resetGame();
                    e.preventDefault();
                }
                return;
            }

            if (keyPressed === LEFT && dx === 0) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === UP && dy === 0) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            if (keyPressed === RIGHT && dx === 0) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === DOWN && dy === 0) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        });

        // Start initial game
        resetGame();
    </script>
</body>
</html>
