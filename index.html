<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Snake Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-green-hover: #16a34a;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #4ade80, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-board {
            display: flex;
            gap: 16px;
        }

        .score-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            min-width: 70px;
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            transition: transform 0.2s ease;
        }

        .score-value.pulse {
            transform: scale(1.15);
            color: #4ade80;
        }

        .canvas-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            border: 2px solid var(--border-color);
        }

        canvas {
            display: block;
            background-color: #0b0f19;
        }

        .controls-panel {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            width: 100%;
        }

        .btn {
            flex: 1;
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #052e16;
        }

        .btn-primary:hover {
            background-color: var(--accent-green-hover);
        }

        #instructions {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 16px;
                border: none;
                border-radius: 0;
                background: transparent;
                box-shadow: none;
            }
            .canvas-wrapper, canvas {
                width: 320px;
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <h1>Snake</h1>
            <div class="score-board">
                <div class="score-card">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">High</div>
                    <div class="score-value" id="high-score">0</div>
                </div>
            </div>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>
        
        <div class="controls-panel">
            <button id="pause-btn" class="btn">Pause (P)</button>
            <button id="restart-btn" class="btn btn-primary">Restart (R)</button>
        </div>

        <div id="instructions">Use Arrow Keys to move. Press P to pause, R to restart.</div>
    </div>

    <script type="module" src="js/main.js"></script>
>
</body>
</html>
</body>
</html>
