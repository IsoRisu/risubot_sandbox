<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Snake Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-green-hover: #16a34a;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #4ade80, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-board {
            display: flex;
            gap: 16px;
        }

        .score-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            min-width: 70px;
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            transition: transform 0.2s ease;
        }

        .score-value.pulse {
            transform: scale(1.15);
            color: #4ade80;
        }

        .canvas-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            border: 2px solid var(--border-color);
        }

        canvas {
            display: block;
            background-color: #0b0f19;
        }

        .controls-panel {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            width: 100%;
        }

        .btn {
            flex: 1;
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #052e16;
        }

        .btn-primary:hover {
            background-color: var(--accent-green-hover);
        }

        #instructions {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 16px;
                border: none;
                border-radius: 0;
                background: transparent;
                box-shadow: none;
            }
            .canvas-wrapper, canvas {
                width: 320px;
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <h1>Snake</h1>
            <div class="score-board">
                <div class="score-card">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">High</div>
                    <div class="score-value" id="high-score">0</div>
                </div>
            </div>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>
        
        <div class="controls-panel">
            <button id="pause-btn" class="btn">Pause (P)</button>
            <button id="restart-btn" class="btn btn-primary">Restart (R)</button>
        </div>

        <div id="instructions">Use Arrow Keys to move. Press P to pause, R to restart.</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");
        const pauseBtn = document.getElementById("pause-btn");
        const restartBtn = document.getElementById("restart-btn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 5, y: 5, type: 'normal' };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        highScoreEl.textContent = highScore;

        let gameInterval = null;
        let gameSpeed = 100;
        let isGameOver = false;
        let isPaused = false;
        let changingDirection = false;
        let activeEffect = null;
        let effectTimer = null;

        function getSpeed() {
            // Speed varies based on score, gets faster progressively, modified by power-ups
            let base = Math.max(50, 100 - Math.floor(score / 40) * 8);
            if (activeEffect === 'slow') base += 35;
            if (activeEffect === 'speed') base = Math.max(40, base - 30);
            return base;
        }

        function updateGameInterval() {
            if (gameInterval) clearInterval(gameInterval);
            if (!isPaused && !isGameOver) {
                gameInterval = setInterval(gameLoop, getSpeed());
            }
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            isGameOver = false;
            isPaused = false;
            activeEffect = null;
            if (effectTimer) clearTimeout(effectTimer);
            pauseBtn.textContent = "Pause (P)";
            spawnFood();
            updateGameInterval();
            draw();
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                if (gameInterval) clearInterval(gameInterval);
                pauseBtn.textContent = "Resume (P)";
                drawOverlay("PAUSED", "Press P to Resume");
            } else {
                updateGameInterval();
                pauseBtn.textContent = "Pause (P)";
            }
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // Determine food type: normal (red), bonus (yellow), slow down (blue), speed up (purple)
            const rand = Math.random();
            if (rand < 0.60) {
                food.type = 'normal';
            } else if (rand < 0.80) {
                food.type = 'bonus';
            } else if (rand < 0.90) {
                food.type = 'slow';
            } else {
                food.type = 'speed';
            }

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function gameLoop() {
            changingDirection = false;
            update();
            if (isGameOver) return;
            draw();
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Improved Precise Collision Detection & Wrap/Wall logic
            // Using precise bounding box check on head vs snake body segments
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Food collision with precise hit detection
            if (head.x === food.x && head.y === food.y) {
                if (food.type === 'normal') {
                    score += 10;
                } else if (food.type === 'bonus') {
                    score += 30;
                } else if (food.type === 'slow') {
                    score += 15;
                    activeEffect = 'slow';
                    if (effectTimer) clearTimeout(effectTimer);
                    effectTimer = setTimeout(() => { activeEffect = null; updateGameInterval(); }, 6000);
                } else if (food.type === 'speed') {
                    score += 20;
                    activeEffect = 'speed';
                    if (effectTimer) clearTimeout(effectTimer);
                    effectTimer = setTimeout(() => { activeEffect = null; updateGameInterval(); }, 5000);
                }

                scoreEl.textContent = score;
                scoreEl.classList.add("pulse");
                setTimeout(() => scoreEl.classList.remove("pulse"), 250);

                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    highScoreEl.classList.add("pulse");
                    setTimeout(() => highScoreEl.classList.remove("pulse"), 250);
                    localStorage.setItem("snake_high_score", highScore);
                }
                updateGameInterval();
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = "#0b0f19";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle grid pattern
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food based on type with custom colors and glowing indicators
            let foodColor = "#ef4444";
            let glowColor = "#ef4444";
            if (food.type === 'bonus') {
                foodColor = "#eab308";
                glowColor = "#eab308";
            } else if (food.type === 'slow') {
                foodColor = "#38bdf8";
                glowColor = "#38bdf8";
            } else if (food.type === 'speed') {
                foodColor = "#a855f7";
                glowColor = "#a855f7";
            }

            ctx.fillStyle = foodColor;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
            ctx.shadowBlur = 0;

            // Draw active effect status on canvas if present
            if (activeEffect) {
                ctx.fillStyle = activeEffect === 'slow' ? "rgba(56, 189, 248, 0.8)" : "rgba(168, 85, 247, 0.8)";
                ctx.font = "bold 12px 'Segoe UI', sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(`EFFECT: ${activeEffect.toUpperCase()}`, 10, 22);
            }

            // Draw snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#22c55e" : "#4ade80";
                if (index === 0) {
                    ctx.shadowColor = "#22c55e";
                    ctx.shadowBlur = 6;
                }
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0;
            });
        }

        function drawOverlay(title, subtitle) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f8fafc";
            ctx.font = "bold 26px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 12);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px 'Segoe UI', sans-serif";
            ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            drawOverlay("GAME OVER", "Press R or Space to Restart");
        }

        pauseBtn.addEventListener("click", togglePause);
        restartBtn.addEventListener("click", resetGame);

        document.addEventListener("keydown", e => {
            const keyPressed = e.key.toLowerCase();
            const keyCode = e.keyCode;

            if (keyPressed === ' ' || keyPressed === 'r' || keyCode === 32) {
                if (isGameOver || keyPressed === 'r') {
                    resetGame();
                    e.preventDefault();
                    return;
                }
            }

            if (keyPressed === 'p') {
                togglePause();
                e.preventDefault();
                return;
            }

            if (isPaused || isGameOver) return;
            if (changingDirection) return;

            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            if ((keyPressed === 'arrowleft' || keyCode === LEFT) && dx === 0) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 'arrowup' || keyCode === UP) && dy === 0) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            if ((keyPressed === 'arrowright' || keyCode === RIGHT) && dx === 0) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 'arrowdown' || keyCode === DOWN) && dy === 0) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        });

        // Start initial game
        resetGame();
    </script>
</body>
</html>
</body>
</html>
